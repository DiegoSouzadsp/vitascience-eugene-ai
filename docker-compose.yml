version: '3.8'

services:
  postgres-vector:
    image: ankane/pgvector
    container_name: eugene_postgres
    environment:
      POSTGRES_DB: eugene_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eugene_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N removed - using remote instance on network
  # Remote N8N URL will be configured via environment variables

  rag-api:
    build:
      context: .
      dockerfile: ./docker/rag-api.Dockerfile
    container_name: eugene_rag_api
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres-vector:5432/eugene_rag
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres-vector:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  default:
    name: eugene_network
version: '3.8'

services:
  postgres-vector:
    image: ankane/pgvector
    container_name: eugene_postgres
    environment:
      POSTGRES_DB: eugene_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eugene_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # N8N removed - using remote instance on network
  # Remote N8N URL will be configured via environment variables

  # LLM Embedding Service - porta 9000 (LLM-agnostic)
  llm-service:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.llm-service
    container_name: eugene_llm_service
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  rag-api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.rag-api
    container_name: eugene_rag_api
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres-vector:5432/eugene_rag
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_SERVICE_URL=http://llm-service:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres-vector:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    container_name: eugene_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=password
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eugene_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  redis_data:

networks:
  default:
    name: eugene_network